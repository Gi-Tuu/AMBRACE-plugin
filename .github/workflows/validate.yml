name: validate-plugins

on:
  pull_request:
    paths: ["plugins/**"]
  push:
    paths: ["plugins/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验插件（manifest/hooks/权限/危险 API/大小）
        run: python scripts/validate_plugin.py plugins